# Server
server.port=${SERVER_PORT:8080}

# Application
spring.application.name=UniManage-BE
spring.main.banner-mode=off

# Database - use environment variables (no defaults for security)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/unimanage-db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:9787}

# JPA/Hibernate - IMPORTANT: never use 'update' in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Connection pool settings (add these for production)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging - less verbose in production
logging.level.root=WARN
logging.level.org.plongrotha.UniManage=INFO
logging.level.org.springframework.data.redis=WARN
logging.level.io.lettuce.core=WARN

# Redis
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.jedis.pool.max-active=20
spring.data.redis.jedis.pool.max-idle=10
spring.data.redis.jedis.pool.min-idle=5

# Swagger - DISABLE in production for security
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Security headers (if using Spring Security)
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never