server.port=8080
spring.application.name=UniManage-BE
spring.main.banner-mode=console 
spring.datasource.url=jdbc:mysql://localhost:3306/unimanage-db
spring.datasource.username=root
spring.datasource.password=9787
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# logging
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.plongrotha.UniManage=INFO

# swagger
#springdoc.api-docs.enabled=true

# redis config
spring.cache.type=redis
spring.data.redis.client-type=jedis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
# spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=5000ms
spring.data.redis.connect-timeout=2000ms
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=8

# Enable logging to see connection info
logging.level.org.springframework.data.redis=ERROR
logging.level.io.lettuce.core=ERROR
logging.level.org.apache.commons.pool2=ERROR

# swagger config
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true