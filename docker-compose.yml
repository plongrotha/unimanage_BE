services:
  # Your Spring Boot Backend
  backend:
    image: plongrotha/unimanage-backend:latest
    container_name: backend-unimanage
    ports:
      - "8080:8080"
    environment:
      # Database connection
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:mysql://mysql:3306/unimanage-db
      - DATABASE_USERNAME=root
      - DATABASE_PASSWORD=9787
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

      # Redis connection
      - REDIS_HOST=redis-unimanage
      - REDIS_PORT=6379
      - REDIS_PASSWORD=

      # Server configuration
      - SERVER_PORT=8080
    depends_on:
      - mysql
      - redis
    networks:
      - unimanage-network
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mysql-unimanage
    environment:
      - MYSQL_ROOT_PASSWORD=9787
      - MYSQL_DATABASE=unimanage-db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - unimanage-network
    restart: unless-stopped

  # Your existing Redis
  redis:
    image: redis:latest
    container_name: redis-unimanage
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - unimanage-network
    restart: unless-stopped

networks:
  unimanage-network:
    driver: bridge

volumes:
  redis-data:
  mysql-data:

